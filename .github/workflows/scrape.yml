name: Sefer Saatlerini Güncelle

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          cd scrapers
          pip install -r requirements.txt

      - name: Scraper'ları çalıştır
        run: |
          cd scrapers
          python run_all.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seferler.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "auto: sefer saatleri güncellendi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
