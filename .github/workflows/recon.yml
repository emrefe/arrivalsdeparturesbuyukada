name: Recon (Playwright) — Render edilmiş HTML
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Recon scriptini çalıştır
        run: python scripts/playwright_recon.py

      - name: Repo'ya commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recon/
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "recon (playwright): rendered html dump"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✓ Push başarılı (deneme $i)"
              exit 0
            fi
            echo "Push reddedildi, pull --rebase deneniyor..."
            git pull --rebase --autostash origin main
            sleep 2
          done
          echo "✗ 5 denemede de push başarısız"
          exit 1
