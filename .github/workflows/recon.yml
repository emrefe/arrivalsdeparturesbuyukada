name: Recon (Playwright) — Render edilmiş HTML
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Recon scriptini çalıştır
        run: python scripts/playwright_recon.py

      - name: Repo'ya commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recon/
          git diff --cached --quiet || (git commit -m "recon (playwright): rendered html dump" && git push)
